<div class="change-password-container">
  <div class="change-password-card">
    <div class="change-password-header">
      <h1>Change Password</h1>
      <p>You must change your password to continue.</p>
    </div>

    <!-- Messages -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Change Password Form -->
    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()" class="auth-form">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          [class.error]="
            changePasswordControls['newPassword'].invalid &&
            changePasswordControls['newPassword'].touched
          "
          placeholder="Enter new password"
        />
        <div
          *ngIf="
            changePasswordControls['newPassword'].invalid &&
            changePasswordControls['newPassword'].touched
          "
          class="field-error"
        >
          <span *ngIf="changePasswordControls['newPassword'].errors?.['required']"
            >New password is required</span
          >
          <span *ngIf="changePasswordControls['newPassword'].errors?.['minlength']"
            >Password must be at least 8 characters</span
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          [class.error]="
            changePasswordControls['confirmPassword'].invalid &&
            changePasswordControls['confirmPassword'].touched
          "
          placeholder="Confirm new password"
        />
        <div
          *ngIf="
            changePasswordControls['confirmPassword'].invalid &&
            changePasswordControls['confirmPassword'].touched
          "
          class="field-error"
        >
          <span *ngIf="changePasswordControls['confirmPassword'].errors?.['required']"
            >Please confirm your password</span
          >
          <span *ngIf="changePasswordControls['confirmPassword'].errors?.['passwordMismatch']"
            >Passwords do not match</span
          >
        </div>
      </div>

      <button
        type="submit"
        [disabled]="changePasswordForm.invalid || isLoading"
        class="primary-button"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Changing...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
