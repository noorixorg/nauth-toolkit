<div class="mfa-method-selector">
  <h3>Choose an MFA method</h3>
  <div class="method-options">
    @if (allowedMethods.includes('sms')) {
      <button
        type="button"
        class="method-card"
        (click)="onMethodSelected('sms')"
        [disabled]="isLoading"
      >
        <div class="method-icon">📱</div>
        <div class="method-title">SMS</div>
        <div class="method-description">
          Receive verification codes via text message
          @if (userPhone) {
            <br />
            <small style="color: #999; margin-top: 0.25rem; display: block">
              Current: {{ maskPhone(userPhone) }}
            </small>
          }
        </div>
      </button>
    }

    @if (allowedMethods.includes('email')) {
      <button
        type="button"
        class="method-card"
        (click)="onMethodSelected('email')"
        [disabled]="isLoading"
      >
        <div class="method-icon">📧</div>
        <div class="method-title">Email</div>
        <div class="method-description">Receive verification codes via email</div>
      </button>
    }

    @if (allowedMethods.includes('totp')) {
      <button
        type="button"
        class="method-card"
        (click)="onMethodSelected('totp')"
        [disabled]="isLoading"
      >
        <div class="method-icon">🔐</div>
        <div class="method-title">Authenticator App</div>
        <div class="method-description">Use Google Authenticator or similar app</div>
      </button>
    }

    @if (allowedMethods.includes('passkey')) {
      <button
        type="button"
        class="method-card"
        (click)="onMethodSelected('passkey')"
        [disabled]="isLoading"
      >
        <div class="method-icon">🔑</div>
        <div class="method-title">Passkey</div>
        <div class="method-description">Use biometric authentication or security key</div>
      </button>
    }

    @if (allowedMethods.includes('backup')) {
      <button
        type="button"
        class="method-card"
        (click)="onMethodSelected('backup')"
        [disabled]="isLoading"
      >
        <div class="method-icon">🔓</div>
        <div class="method-title">Backup Code</div>
        <div class="method-description">Use one of your backup recovery codes</div>
      </button>
    }
  </div>
</div>
