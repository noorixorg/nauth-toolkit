<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>SampleAngular</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@latest/primeicons.css" />
    <script>
      // Prevent dark mode from being applied
      (function () {
        // Remove any dark mode classes
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.documentElement.setAttribute('data-theme', 'light');

        // Prevent dark mode class from being added
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
              const html = document.documentElement;
              if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
              }
            }
            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
              if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
              }
            }
          });
        });

        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class', 'data-theme'],
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
