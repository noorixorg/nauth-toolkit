# Default logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "30"
    compress: "true"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nauth-postgres
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nauth_network
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nauth_sample}
      POSTGRES_USER: ${DB_USERNAME:-nauth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nauth_user} -d ${DB_DATABASE:-nauth_sample}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dragonfly for session storage (Redis-compatible)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: nauth-dragonfly
    restart: unless-stopped
    logging: *default-logging
    networks:
      - nauth_network
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./sample-nestjs
      dockerfile: Dockerfile
    container_name: nauth-backend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "13005:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-nauth_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-nauth_sample}
      REDIS_URL: redis://dragonfly:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      APP_NAME: ${APP_NAME:-Nauth Demo}
      COMPANY_NAME: ${COMPANY_NAME:-Nauth Company}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@nauth.dev}
      LOGO_URL: ${LOGO_URL}
      DASHBOARD_URL: ${DASHBOARD_URL}
      BRAND_COLOR: ${BRAND_COLOR:-#4f46e5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      APPLE_SERVICE_ID: ${APPLE_SERVICE_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_P8_KEY: ${APPLE_P8_KEY}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      PASSKEY_TIMEOUT: ${PASSKEY_TIMEOUT:-60000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_ENTERPRISE_PROJECT_ID: ${RECAPTCHA_ENTERPRISE_PROJECT_ID}
      RECAPTCHA_ENTERPRISE_API_KEY: ${RECAPTCHA_ENTERPRISE_API_KEY}
      RECAPTCHA_ENTERPRISE_SITE_KEY: ${RECAPTCHA_ENTERPRISE_SITE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nauth_network

  # Angular Frontend
  # Build args (from examples/.env) -> Dockerfile ARG -> environment.prod.ts
  # API_BASE_URL, TOKEN_MODE: same name. RECAPTCHA_ENTERPRISE_SITE_KEY -> RECAPTCHA_SITE_KEY
  frontend:
    build:
      context: ./sample-angular
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-https://demo.nauth.dev/api}
        RECAPTCHA_SITE_KEY: ${RECAPTCHA_ENTERPRISE_SITE_KEY:-}
        RECAPTCHA_VERSION: ${RECAPTCHA_VERSION:-enterprise}
        RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
        TOKEN_MODE: ${TOKEN_MODE:-cookies}
        SHOW_APPLE_LOGIN: ${SHOW_APPLE_LOGIN:-false}
        SHOW_FACEBOOK_LOGIN: ${SHOW_FACEBOOK_LOGIN:-false}
    container_name: nauth-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "13006:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nauth_network

volumes:
  postgres_data:
  dragonfly_data:

networks:
  nauth_network:
    name: nauth_network
