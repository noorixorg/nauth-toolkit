name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report both runtimes independently - a break on the floor version
      # should not hide the result on the recommended one.
      fail-fast: false
      matrix:
        # 22 is the engines floor declared by every package; 24 matches .nvmrc
        # and is the version contributors develop on. Both must stay green.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Version is read from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # `client-angular` publishes from `dist` and sets `linkDirectory`, so pnpm links
      # that directory into the workspace apps that depend on it. It does not exist
      # before the first build, and pnpm resolves links before any lifecycle script
      # runs, so install fails on a clean checkout unless the directory is already
      # there. The build overwrites it moments later.
      - name: Create client-angular link target
        run: mkdir -p packages/client-angular/dist

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build:all

      - name: Lint
        run: pnpm lint

      - name: Test all packages
        run: pnpm test:all
